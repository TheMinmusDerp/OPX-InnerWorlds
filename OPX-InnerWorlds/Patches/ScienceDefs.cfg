@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
	@RESULTS
    {
        DresInSpaceHigh = Dres looks to be patchworked together, large swaths of light grey and beige rock being sewn with one another, this tapestry seemingly stretching across its entire surface.
        DresInSpaceLow = At this height, you note how scarred the surface is; swarming with craters of varying size. The planet must have been formed early in the Kerbolar system's lifetime with just how many mark its surface.
        DresSrfLandedLowlands = Peering out the window you see the horizon, vast outcroppings and mountains stretch across it as far as the eye can see.
        DresSrfLandedMidlands = Peering out the window you see the horizon, vast outcroppings and mountains stretch across it as far as the eye can see.
        DresSrfLandedHighlands = Peering out the window you see the horizon, vast outcroppings and mountains stretch across it as far as the eye can see.
        DresSrfLandedSaltDeposits = Salt crystals can be seen shimmering in the light as they float away from the impact of your landing.
        DresSrfLandedMajorCraters = Boulders and ejecta are scattered across the inside of the crater. The height of the rims from their associated impacts definitely made landing on the surface of Dres much easier.
        DresSrfLandedMinorCraters = Boulders and ejecta are scattered across the inside of the crater. The height of the rims from their associated impacts definitely made landing on the surface of Dres much easier.
        DresSrfLandedCanyon = The canyon you've landed within seems to stretch for kilometers. With how its walls surround the spacecraft, you can't help but feel that the planet itself could swallow you whole at any moment.

        PlasInSpaceHigh = From out here, Plas looks like nothing more than a golf ball; drifting in the expanse of space after someone drove it to kingdom come.
        PlasInSpaceLow = Like a gigantic piece of pumice, the surface of Plas is marked with hundreds of rippling craters and pores... Not too far off from a golf ball, really.
        PlasSrfLandedLowlands = Seeing all of the chaotically shaped hills and mountains outside of your viewport makes you wonder how you nailed the landing.
        PlasSrfLandedMidlands = Seeing all of the chaotically shaped hills and mountains outside of your viewport makes you wonder how you nailed the landing.
        PlasSrfLandedHighlands = Seeing all of the chaotically shaped hills and mountains outside of your viewport makes you wonder how you nailed the landing.
        PlasSrfLandedPoles = The poles of Plas are either bathed in complete sunlight, or total darkness depending when you arrived there. In any event, hopefully you packed a pair of sunglasses, an extra flashlight, or both!
        PlasSrfLandedCraters = Craters on the surface of Plas are not spared from the the landscape's seemingly random texture. You worried that you'll stub your toe the moment you step outside the airlock.
        PlasSrfLandedHoganCrater = An expanse of spiky hills takes up the viewport. The rims of the crater can be barely seen peeking through the rest of the surrounding terrain. 
        PlasSrfLandedMountBasore = Looking out of the window, you see Krov silently shuffling above the night sky. Until they see it for themselves, mountain climbers on Kerbin can eat their hearts out.

        KrovInSpaceHigh = At a quick glance, it doesn't seem remiss to believe Krov was shaved straight off of Plas's southern pole. If that was the case, you struggle to understand how it wasn't ejected from Plas's gravitational field.
        KrovInSpaceLow = Several valleys are seen banding across the width of the tiny moon. It creates a pleasant contrast between Krov's otherwise lumpy surface, scattered with a menagerie of craters.
        KrovSrfLanded = Looking outside, you can't help but notice Plas eerily floating in place above the surface. It leaves you with a strong feeling of suspense that you wish would've left you by now.

        SelbigInSpaceHigh = Did... someone leave a blueberry floating around the cabin? You reach out to grab it, but hit nothing but glass.
        SelbigInSpaceLow = You make out some flatter, grey areas of rock that stand out against the asteroid's strong blue flavor. They seem like good options for landing sites.
        SelbigSrfLandedHighlands = At any moment, you were waiting for the smell of blueberries to hit your nose. You pick up nothing but recycled air, unfortunately.
        SelbigSrfLandedMidlands = At any moment, you were waiting for the smell of blueberries to hit your nose. You pick up nothing but recycled air, unfortunately.
        SelbigSrfLandedLowlands = You can't help but notice how quiet it is around the capsule. Maybe someone did drop this thing by mistake.
        SelbigSrfLandedCraters = Seeing a bit of ice kicked up from your landing has you craving a snow cone now. On second thought, a Selbig cone doesn't sound as tasty.
        SelbigSrfLandedWingeCrater = This spectacular crater stretches for kilometers! Alas, it does not seem to be as blue as the rest of the asteroid.

        HafniaInSpaceHigh = This asteroid has one of the largest craters you've ever seen! With how massive it is, it's a surprise that Hafnia managed to survive the force of the object that impacted it.
        HafniaInSpaceLow = You begin to make out the broad rifts and grooves that band Hafnia's surface. Stretching from end to end, the asteroid looks like it could break apart at any moment.
        HafniaSrfLandedTomlinsonCrater = It's hard to make out anything except for the rims of the massive crater and the darkness of space above. In a way, you're in a viewport... seeing out of another viewport?
        HafniaSrfLandedLowlands = A wave of grey dust blocks the viewport as you touch down. Maybe it's a good idea to take a step outside to see what's out there?
        HafniaSrfLandedMidlands = A wave of grey dust blocks the viewport as you touch down. Maybe it's a good idea to take a step outside to see what's out there?
        HafniaSrfLandedHighlands = A wave of grey dust blocks the viewport as you touch down. Maybe it's a good idea to take a step outside to see what's out there?
        HafniaSrfLandedEjecta = A wave of grey dust blocks the viewport as you touch down. Maybe it's a good idea to take a step outside to see what's out there?
        HafniaSrfLandedCraters = A wave of grey dust blocks the viewport as you touch down. Maybe it's a good idea to take a step outside to see what's out there?

        KortensInSpaceHigh = The shape of this asteroid looks like the MacGuffin of a sport you can't seem to remember all too well. Kortens's oblate shape is something to be nostalgically noted.
        KortensInSpaceLow = Cracks and rifts in Kortens's surface are clearly visible out of the window. Occasionally, orange deposits on the ground cross your view. Maybe they taste like butterscotch?
        KortensSrfLandedCraters = Kortens's marred landscape is a paradoxical beauty to behold. You sit reluctantly inside of the crew module, concerned that you're already disrupting something that none were meant to see.
        KortensSrfLandedLowlands = Kortens's marred landscape is a paradoxical beauty to behold. You sit reluctantly inside of the crew module, concerned that you're already disrupting something that none were meant to see. 
        KortensSrfLandedHighlands = Kortens's marred landscape is a paradoxical beauty to behold. You sit reluctantly inside of the crew module, concerned that you're already disrupting something that none were meant to see. 
        KortensSrfLandedCarbonDeposits = Copper-colored dust gets kicked up around you as you peer around the landing site. The butterscotch here seems to have gone bad, if you could call it that. 

        LuiInSpaceHigh = For a moment, it looks like you have a smudge on your viewport. Trying to wipe it away, you see Kortens peeking out from behind. Never before have you seen moons THIS small.
        LuiInSpaceLow = Lui's complexion is rather uniform, compared to its parent asteroid. It makes you wonder how it's survived wandering through space without a major crater on its surface.
        LuiSrfLanded = Even from inside the crew module, you swear you can see the extent of the moon from end to end.

        AntonInSpaceHigh = A piece of lint seems to be floating around the cabin... No, nevermind. That's just Anton.
        AntonInSpaceLow = The asteroid moon's surface is pretty lumpy. It's just a giant, loosely formed pile of regolith drifting in space. You're sure there's someone crazy enough back home to want to be the ruler of an interstellar sand castle.
        AntonSrfLanded = Even from inside, you can make out the edges of the asteroid moon. With how small it is, you could probably get an entire tour of it while sitting here in the crew module!

        LoushineInSpaceHigh = Maybe bringing a biologist aboard for the trip here would've been a good idea. You're convinced that this asteroid is in fact a space whale. The Kraken's finally found its match! 
        LoushineInSpaceLow = A massive crumpled-looking region at the center of the asteroid keeps your attention outside the viewport. You throw some dehydrated snacks at each other to see if they'll fuse.
        LoushineSrfLandedKaramanskiLobe = You're afraid to even unbuckle your safety harness, fearing that you'll fall out of the side of the spacecraft and into deep space.
        LoushineSrfLandedWeberLobe = You're afraid to even unbuckle your safety harness, fearing that you'll fall out of the side of the spacecraft and into deep space.
        LoushineSrfLandedSlopes = Large ridges and craters drop off into nothingness; the asteroid's surface looks like a bottomless cliff... in any of the three dimensions. You're not even sure you *want* to get out.
        LoushineSrfLandedNeck = Landing at the center of the asteroid provides you a little more piece of mind, under more normal conditions. Staring up at the heights of the lobes, however, does nothing but unnerve you.
        LoushineSrfLandedCraters = If the spacecraft started to drift away here, you at least have some leverage to grab onto. Maybe you can throw an anchor out of the window, so it catches on the rim of the crater. For insurance!
        LoushineSrfLandedKaramanskiLobe = It's a bit of a struggle to maintain balance from the off-putting angle of gravity across Loushine's highlands. It could be a good idea to place a sleeping bag on one of the walls.
        LoushineSrfLandedWeberLobe = It's a bit of a struggle to maintain balance from the off-putting angle of gravity across Loushine's highlands. It could be a good idea to place a sleeping bag on one of the walls.
        LoushineSrfLandedSlopes =  Surprisingly, Loushine's dusty surface seems to be just as sturdy as any other that kerbals have landed vehicles on. You aren't sure what to make of this.
        LoushineSrfLandedNeck = Loushine's darker-colored lowlands look a bit more like how the surface of an asteroid was expected to appear. It only helps to further contrast against the reddish highlands.
        LoushineSrfLandedCraters = Craters are a constant across asteroids, so Loushine having plenty of them is unsurprising. At least they can provide a good view of Everhart as it passes overhead.

        EverhartInSpaceHigh = Everhart's miniscule size and mass makes its sphere of influence pitifully small. You begin to wonder if this distance should even be considered "high above" the moon.
        EverhartInSpaceLow = Everhart's incredibly small size results in disorienting views as you look at it through the window. The view from only a few hundred meters above the surface resembles ones from tens of kilometers above any other planet in the system.
        EverhartSrfLandedHighlands = An odd, almost ominous feeling washes over you as you land... it might be best to stay close to the vessel if an EVA is on your agenda.
        EverhartSrfLandedLowlands = Loushine spinning overhead raises a question in your mind: why is Everhart the spheroidal one and not the asteroid it orbits? You ponder this for a few seconds before the space center urges you to send in the report.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    @RESULTS
    {
        DresSrfLandedLowlands = When looking closely at the ground, you see various types of minerals mixed together.
        DresSrfLandedMidlands = When looking closely at the ground, you see various types of minerals mixed together.
        DresSrfLandedHighlands = When looking closely at the ground, you see various types of minerals mixed together.
        DresSrfLandedCanyon = As you look across the canyon's rim, you wonder if you could race across it and make it back for supper.
        DresSrfLandedMajorCraters = You kick a piece of rock in a feeble attempt to see how wide the crater is. You get bored before you can see it impact the other side.
        DresSrfLandedMinorCraters = You kick a piece of rock in a feeble attempt to see how wide the crater is. You get bored before you can see it impact the other side.
        DresSrfLandedSaltDeposits = Stepping onto the surface, crystaline salt crackles and shifts around your boot, not too dissimilar from a snowy day all the way back home.
        DresInSpaceLowLowlands = The jagged, twisted landscape becomes even more noticeable now. You get the sudden urge to scratch your back.
        DresInSpaceLowMidlands = The jagged, twisted landscape becomes even more noticeable now. You get the sudden urge to scratch your back.
        DresInSpaceLowHighlands = The jagged, twisted landscape becomes even more noticeable now. You get the sudden urge to scratch your back.
        DresInSpaceLowCanyon = As you approach the canyon, you can't help but wonder if this is how mint ice cream feels when you're eating it.
        DresInSpaceLowMajorCraters = Despite never having been here before, you get a sense of deja vu. The size and depth of these craters aren't far off from those on the Mun's surface. Just like the simulations. 
        DresInSpaceLowMinorCraters = Despite never having been here before, you get a sense of deja vu. The size and depth of these craters aren't far off from those on the Mun's surface. Just like the simulations. 
        DresInSpaceLowSaltDeposits = If you squint hard enough, you can make out a puff of mist shooting from the speckling that dots the planet's surface. You debate sticking out a limb to get a taste of the eruption. It's not very tasty.
        DresInSpaceHigh = From out here, you can't help but think that Dres is one giant dust-bunny. No wonder it took astronomers so long to figure out what it was.

        PlasSrfLandedLowlands = Sheets of material splinter and twirl in front of you as they're crushed underneath your boots. Slowly, they drift out into space never to be seen again.
        PlasSrfLandedMidlands = Sheets of material splinter and twirl in front of you as they're crushed underneath your boots. Slowly, they drift out into space never to be seen again.
        PlasSrfLandedHighlands = Sheets of material splinter and twirl in front of you as they're crushed underneath your boots. Slowly, they drift out into space never to be seen again.
        PlasSrfLandedPoles = As you look out, you either see everything ahead of you... or nothing at all. This becomes a quandary that bothers you for the rest of your time here.
        PlasSrfLandedCraters = On no other world would you think exploring a crater would turn into a bouldering circuit... except this one.
        PlasSrfLandedHoganCrater = The bottom of this crater seems to stretch for an unreasonable distance. The spiked rock formations sprinkled atop it has you wondering how long it would take you to traverse it on foot... or if that's even possible.
        PlasSrfLandedMountBasore = At the highest point of Plas, you note that one jump is all it would take to throw someone into orbit. You are not that someone, unless you signed all of your liability wavers!
        PlasInSpaceLowLowlands = The rough complexion of the asteroid below doesn't fill you with much confidence. Getting here was the easy part; what's landing going to be?
        PlasInSpaceLowMidlands = The rough complexion of the asteroid below doesn't fill you with much confidence. Getting here was the easy part; what's landing going to be?
        PlasInSpaceLowHighlands = The rough complexion of the asteroid below doesn't fill you with much confidence. Getting here was the easy part; what's landing going to be?
        PlasInSpaceLowPoles = You think that it's probably best to head back to the airlock. If it's not for the complete darkness that envelops everything below, you should make sure you're able to land without being blinded by Kerbol's rays.
        PlasInSpaceLowCraters = What you initially considered to be a pretty predictable feature has turned into a geologic nightmare. You reconsider even stepping out to take a look of the situation beneath you.
        PlasInSpaceLowHoganCrater = Approaching the crater, you can make out a massive mountain formation that straddles its rim. For a moment, you think about leapfrogging your spacecraft to try and get closer to it.
        PlasInSpaceLowMountBasore = With the sprawling mountain range reaching up from below, you stick your arms out as far as you can to desperately try and give it a high-five.
        PlasInSpaceHigh = With how distant Plas appears from here, you're tempted to grab a nine-iron from out of your spacesuit to wack it across the cosmos.

        KrovSrfLanded = Nervously, you try and reach for the loose dust and rock beneath you to keep you anchored; worrying that one bad step is all it would take to fling yourself off of Krov.
        KrovInSpaceLow = You start considering how much it would take to use your EVA jetpack to make it down to the surface. Seems like a win-win situation for everybody.
        KrovInSpaceHigh = Staring down at Krov suspended in space, you try to grab it with your fingers to reattach it to Plas. This, unfortunately, doesn't do anything.

        SelbigSrfLandedHighlands = There's nothing but dark blue, everywhere you look. You can't believe they make blueberries this big!
        SelbigSrfLandedMidlands = There's nothing but dark blue, everywhere you look. You can't believe they make blueberries this big!
        SelbigSrfLandedLowlands = A lot of the blue dust has been blasted to make way for the asteroid's drab silicate interior. You wonder how far you'd have to dig to start finding seeds.
        SelbigSrfLandedCraters = A lot of the blue dust has been blasted to make way for the asteroid's drab silicate interior. You wonder how far you'd have to dig to start finding seeds.
        SelbigSrfLandedWingeCrater = You wonder if you can reach the crater's central peak by jumping in the asteroid's low gravity. 
        SelbigInSpaceLowHighlands = The surface of Selbig looks softer than other asteroids within the belt. You get hungry, wishing you had a really big spoon.
        SelbigInSpaceLowMidlands = The surface of Selbig looks softer than other asteroids within the belt. You get hungry, wishing you had a really big spoon.
        SelbigInSpaceLowLowlands = Seeing the smoothily carved out areas of Selbig's surface, you're upset that Mission Control didn't pack you with an ice cream scoop.
        SelbigInSpaceLowCraters = The craters look pretty shallow compared to the others you've seen. Might be best to redirect the landing to one of those spots. Totally not because you're hungry.
        SelbigInSpaceLowWingeCrater = It's hard not to notice the crater's complex peak as it drifts by you, several kilometers taller than the surrounding terrain. Do we get bonus points if we land there?
        SelbigInSpaceHigh = Something must have had a picnic here and dropped something, or you're seeing things. It's probably best to head back inside, before whatever was here remembers it forgot about it.

        HafniaSrfLandedCraters = Grey powder and pebbles cloud your visor. This place REALLY doesn't want you to see any of its secrets!
        HafniaSrfLandedHighlands = Grey powder and pebbles cloud your visor. This place REALLY doesn't want you to see any of its secrets!
        HafniaSrfLandedMidlands = Grey powder and pebbles cloud your visor. This place REALLY doesn't want you to see any of its secrets!
        HafniaSrfLandedLowlands = Grey powder and pebbles cloud your visor. This place REALLY doesn't want you to see any of its secrets!
        HafniaSrfLandedEjecta = The ground here is noticeably smoother. You make sure to plant yourself, worried of slipping on the thick dust and drifting back into space.
        HafniaSrfLandedTomlinsonCrater = With how deep this impact basin is, you can't fathom how Hafnia survived the collision that formed it!
        HafniaInSpaceLow = Hafnia's shattered appearance becomes even more apparent now. You're hesitant to even approach it, imagining whatever structural faults remain under the surface after such a big collision.
        HafniaInSpaceLowEjecta = The massive stretches of ejecta here are truly fascinating... You wonder how much of it is the remains of the big rock that hit it long ago.
        HafniaInSpaceLowTomlinsonCrater = You believe Mission Control should heavily consider building a swimming pool complex out of this crater. 
        HafniaInSpaceHigh = You can't help but imagine pouring a ladle of hot soup into this impact basin. The minerals here would be good for you... probably!

        KortensSrfLandedCraters = The ground around you looks to be made of amalgamated debris, varying in shape and size. The piles of rubble gathered around are slowly convincing you to eat them. They look like a sootier version of rock candy!
        KortensSrfLandedLowlands = The ground around you looks to be made of amalgamated debris, varying in shape and size. The piles of rubble gathered around are slowly convincing you to eat them. They look like a sootier version of rock candy!
        KortensSrfLandedHighlands = The ground around you looks to be made of amalgamated debris, varying in shape and size. The piles of rubble gathered around are slowly convincing you to eat them. They look like a sootier version of rock candy!
        KortensSrfLandedCarbonDeposits = The bronze color of these lumpy deposits remind you fondly of sand dunes back home. Mission Control might let you bring some of it home in a bottle if you ask them nicely.
        KortensInSpaceLowCraters = Going on a sporadic spacewalk now, out of all times, may not be the best decision made. You may be disturbing the peace of something that wasn't meant to be bothered.
        KortensInSpaceLowLowlands = Going on a sporadic spacewalk now, out of all times, may not be the best decision made. You may be disturbing the peace of something that wasn't meant to be bothered.
        KortensInSpaceLowHighlands = Going on a sporadic spacewalk now, out of all times, may not be the best decision made. You may be disturbing the peace of something that wasn't meant to be bothered.
        KortensInSpaceLowCarbonDeposits = You can't help but shake with the excitement of being able to have the opportunity to eat some interstellar butterscotch! Admittedly, these carbon deposits do look rather appetizing from here.
        KortensInSpaceHigh = Peering down, you start to have second thoughts about what you're planning to do. You can't help but feel a little guilty about being in this situation.

        LuiSrfLanded = With how low the surface gravity is here, "one small step, one giant leap" has all new meaning.
        LuiInSpaceLow = The planetesimal's miniscule size has you convinced that you'd be able to skip off of it to get to Kortens. Whether you'll commit to that remains to be seen.
        LuiInSpaceHigh = It wouldn't take very much from your jetpack to land down on the surface. It wouldn't take much more to get to Kortens, you wager.

        AntonSrfLanded = The loose dust and regolith beneath your boots would be the perfect material to stake a claim into. With a flag of the space-agency-that-you-totally-didn't-scribble-over-with-a-marker, I mean.
        AntonInSpaceLow = You think about how many hops it would take to get from Anton, all the way over to Kortens. You could even use Lui as a stepping stone in-between!
        AntonInSpaceHigh = All you're missing out here is a comically large pool cue. You'd be able to tie the game up with Kortens before you head back home!

        LoushineInSpaceHigh = Everhart looks like a speck from here, orbiting Loushine like a fly circling around food someone left out for too long.
        LoushineInSpaceLowKaramanskiLobe = The terrain looks like it's cobbled together, as though a light tap could knock chunks of it off of the surface. 
        LoushineInSpaceLowWeberLobe = The terrain looks like it's cobbled together, as though a light tap could knock chunks of it off of the surface. 
        LoushineInSpaceLowSlopes = You can't help but think of rock climbing on Loushine's midlands. If you were to climb to the edge of this asteroid and jump toward the center, would you survive?
        LoushineInSpaceLowNeck = The thought of standing on the lowlands and seeing the ends of this asteroid as two gigantic mountains is dizzying, to say the least. It would probably make for Loushine's best landing spot, however.
        LoushineInSpaceLowCraters = It could be easy to end up in a spot that may not see sunlight for years at a time. It's not that far out, but a nuclear power source might not be so bad of an idea...
        LoushineSrfLandedKaramanskiLobe = You kick a pebble by accident and watch as it slowly falls towards the lowlands. It's like watching a slow-motion scene from an action movie.
        LoushineSrfLandedWeberLobe = You kick a pebble by accident and watch as it slowly falls towards the lowlands. It's like watching a slow-motion scene from an action movie.
        LoushineSrfLandedSlopes = Feels like scaling a cliff instead of walking around on this asteroid... which is expected for an object this oblong.
        LoushineSrfLandedNeck = You joke about using Loushine as a cosmic baseball bat, with Everhart as the ball.
        LoushineSrfLandedCraters = Not quite as impressive as the Mun's craters. The notion suddenly makes you wonder why Minmus lacks craters the way that either of these objects do.

        EverhartInSpaceHigh = It looks like a blueberry of sorts. Upon closer inspection of the surface, it even has a little crater where you could imagine a stem coming out of it.
        EverhartInSpaceLowHighlands = The pale blues of the highlands look a bit like unpolished rocks from a quarry. Perhaps a cosmic hammer and chisel are in order.
        EverhartInSpaceLowLowlands = Significantly redder than the rest of the moon. Perhaps the interior of Everhart resembles this color.
        EverhartSrfLandedHighlands = You expected to feel like a giant before you landed, but this moon still seems just barely large enough to squash yet another fleeting dream of yours... ugh.
        EverhartSrfLandedLowlands = You briefly consider the idea of planting a skyscraper on one of Everhart's poles to resemble a blueberry stem, before realizing that Loushine's gravity would probably mess with its orbit.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]
{
    @RESULTS
    {
        DresInSpaceHigh = Gooey tendrils reach out towards the planet's exosphere, slowly coiling back into a ball as it's sated by the trace amounts of water vapor and salt found up here.
        DresInSpaceLow = The Goo contently floats around, gently bouncing off of the insides of the canister. You're not sure what to make of this, but it seems like a good sign.
        DresSrfLanded = The Goo slithers towards the very bottom of the canister. After a tap of the glass, you figure its taking a power nap while you work on more important things. 

        PlasInSpaceHigh = The Goo, floating inside of its container, splits into two distinct shapes. The pair dance around each other, like Plas and its moon do in the expanse of space.
        PlasInSpaceLow = The Goo forms hundreds of spikes on its surface, seemingly mimicing the suface of Plas below. 
        PlasSrfLanded = With how unstable the terrain seems to be here, the Goo dizzingly changes forms; unsure if it has a moment to relax, or if it needs to brace itself for impact.

        KrovInSpaceHigh = The Goo relaxingly splits into many smaller blobs, several of them nearly escaping the grates of the container before its closed.
        KrovInSpaceLow = The Goo forms several tentacles in an effort to frantically plug the deep, cratered holes that mark Krov's surface. Realizing its unable to do so, it sits at the bottom of its container, seemingly frustrated.
        KrovSrfLanded = The Goo shifts in appearance to take the color and texture of the terrain that surrounds it. Its attempt to be one with its surroundings is a valuable lesson that we can take home with us, if nothing else.

        SelbigInSpaceHigh = The Goo curiously turns into a little blue ball. A... Gooberry? It protests you trying to open the container.
        SelbigInSpaceLow = You hear grumbling from inside the container. Is the Goo hungry too? 
        SelbigSrfLanded = The Goo rubs its... face against the edge of the container. It looks hangry now. Best to finish your experiments and leave before the situation gets worse.

        HafniaInSpaceHigh = The Goo sags into a lump in the corner of its container. It looks tired from watching Hafnia spin around.
        HafniaInSpaceLow = The Goo shifts into the shape of a bowl, mimicking the large impact crater on the asteroid's surface.
        HafniaSrfLanded = The Goo does very little in its container. Its inactivity here will surely be studied by the scientists back home.

        KortensInSpaceHigh = The Goo floats in the middle of its container, spinning rapidly in suspension to mimic the asteroid's slightly pancake-ish appearance.
        KortensInSpaceLow = The Goo takes on an orange sheen, mimicking the distinct deposits scattered across Kortens. Maybe you'll have to give it a piece of the butterscotch you find down there.
        KortensSrfLanded = The Goo seems a little disappointed, even upset by the lack of confectioneries found on the asteroid's barren surface.

        LuiInSpace = The Goo floats around silently inside of its container. It seems content.
        LuiSrfLanded = The contents of the container slowly expand to their physical bounds; you've never seen the Goo in such a relaxed state.

        AntonInSpace = The Goo floats quietly around its container. With closer inspection, it looks like it's in deep, meditative thought.
        AntonSrfLanded = The Goo is seen shifting into differing shapes every few seconds. You're not quite sure what to make of it. 

        LoushineInSpaceHigh = The goo bounces around in its container.
        LoushineInSpaceLow = The goo appears to be wobbling slightly. It's as though someone poked it with a stick.
        LoushineSrfLanded = The goo rolls around a bit.

        EverhartInSpaceHigh = The goo has stopped clumping together, seemingly scattered into pieces across the interior of its container.
        EverhartInSpaceLow = Having coated the interior of the container, a lone particle of goo remains floating and bounces off of the sides like a ping pong ball.
        EverhartSrfLanded = The goo has begun churning in the container, seemingly mimicking a lava lamp. Amusingly, it seems to be convecting in a direction parallel to the ground, possibly a result of Everhart's gravity being too weak for hte goo to parse the direction of.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    @RESULTS
    {
        DresSrfLandedLowlands = You find an assortment of trace elements amidst the grey dust, likely deposited from impacts over time.
        DresSrfLandedMidlands = You find an assortment of trace elements amidst the grey dust, likely deposited from impacts over time.
        DresSrfLandedHighlands = You find an assortment of trace elements amidst the grey dust, likely deposited from impacts over time.
        DresSrfLandedCanyon = With how little light reaches the bottom of the canyon, a small amount of water ice glistens amongst the regolith. You worry that your insulated gloves could melt it before you can contain it.
        DresSrfLandedMajorCraters = After a bit of digging, you find some nice chunks of carbon and glass; throwing them in your sample container.
        DresSrfLandedMinorCraters = After a bit of digging, you find some nice chunks of carbon and glass; throwing them in your sample container.
        DresSrfLandedSaltDeposits = Outgassing from a recent eruption has left behind a rich amount of salt. Dried bits of mud stick to the large crystals, the final remains of cryovolcanic magma after its evaporation.

        PlasSrfLandedLowlands = An assortment of sillicate crystals are sifted from the rest of the regolith; the likes of which are associated with some of the oldest meteorites in the Kerbolar system.
        PlasSrfLandedMidlands = An assortment of sillicate crystals are sifted from the rest of the regolith; the likes of which are associated with some of the oldest meteorites in the Kerbolar system.
        PlasSrfLandedHighlands = An assortment of sillicate crystals are sifted from the rest of the regolith; the likes of which are associated with some of the oldest meteorites in the Kerbolar system.
        PlasSrfLandedPoles = Small particulates of a diamondlike substance can be found amongst the regolith. Jewelers back home would get a kick out of this.
        PlasSrfLandedCraters = At first glance, samples gathered here have an even higher concentration of silicates. You run the experiments again to make sure something isn't short-circuiting.
        PlasSrfLandedHoganCrater = The high concentration of silicate material within this crater can explain how jagged and fractured even the terrain is. With very little pressure, even some of the larger formations can shatter if hit by a stray asteroid. It has you imagining what stood atop the surface before it was impacted.
        PlasSrfLandedMountBasore = Along the slopes of the mountain range, large nodules of differentiated material can be found dotting its surfaces. After running an analysis, nothing but an error is returned. Could whatever found here astronomically older than what we've previously discovered?

        KrovSrfLanded = A healthy amount of silica is found in the dust samples you collect. Compositionally, it's fairly similar to material found on Plas's surface. This could indicate that Krov was indeed created from a massive impact that took place sometime after Plas's formation.

        SelbigSrfLandedHighlands = Only a fine blue dust is found on the surface here. Not the blueberries you were hoping for, sadly.
        SelbigSrfLandedMidlands = Only a fine blue dust is found on the surface here. Not the blueberries you were hoping for, sadly.
        SelbigSrfLandedLowlands = These areas contain material from the asteroid's lower layers! This, to your misfortune, reveals that Selbig isn't a blueberry.
        SelbigSrfLandedCraters = You dig around, collecting smooth rocks that litter the ground. It's weird that solar winds haven't blown any of that blue dust on them to cover them up.
        SelbigSrfLandedWingeCrater = Nodules of ancient material are found in these samples. Whatever dropped Selbig here after their picnic must have done it a long, long time ago.

        HafniaSrfLandedCraters = Samples collected from the fractured ground are heavily striated. Hafnia's collision with another body has caused significant geologic change. 
        HafniaSrfLandedHighlands = Samples collected from the fractured ground are heavily striated. Hafnia's collision with another body has caused significant geologic change. 
        HafniaSrfLandedMidlands = Samples collected from the fractured ground are heavily striated. Hafnia's collision with another body has caused significant geologic change. 
        HafniaSrfLandedLowlands = Samples collected from the fractured ground are heavily striated. Hafnia's collision with another body has caused significant geologic change. 
        HafniaSrfLandedEjecta = Shards of the smooth ejecta layer are collected into the sample container. You wonder how long it's taken for this material to solidify; and how much time has passed since the asteroid's impact.
        HafniaSrfLandedTomlinsonCrater = The material gathered in this area contains a heavy amount of breccia, as well pieces of impact melt from the strike of a large asteroid.

        KortensSrfLandedCraters = The sample gathered here is an assortment of rubble; randomly varied in shape and size. Many of these substances are so weathered down, you find it hard to visually identify what they used to be. 
        KortensSrfLandedHighlands = The sample gathered here is an assortment of rubble; randomly varied in shape and size. Many of these substances are so weathered down, you find it hard to visually identify what they used to be. 
        KortensSrfLandedLowlands = The sample gathered here is an assortment of rubble; randomly varied in shape and size. Many of these substances are so weathered down, you find it hard to visually identify what they used to be. 
        KortensSrfLandedCarbonDeposits = You take a sample of the material below you. With how fine the dust collected is, you worry solar winds could blow it away before it's studied. Something in your gut tells you that you're taking something precious from Kortens's surface, but it's unclear why.

        LuiSrfLanded = You scoop up a jumble of rock and crystaline ice; placing it into the sample container. If you wedge your trowel down far enough, you might accidentally fling yourself at escape velocity off of Lui!

        AntonSrfLanded = After picking up a few of the shiniest rocks you could find, you toss one of the duller ones in the direction of Lui; hoping that you could see it impact its surface. Unfortunately, it isn't quite large enough to see at that distance, and knowing your skill you probably missed anyway. 

        LoushineSrfLandedKaramanskiLobe = Plenty of dusty ice particles covered in what appear to be tholins. Whatever this object is, it had some sort of brush with a trans-Neidonian object.
        LoushineSrfLandedWeberLobe = Plenty of dusty ice particles covered in what appear to be tholins. Whatever this object is, it had some sort of brush with a trans-Neidonian object.
        LoushineSrfLandedSlopes = Mostly carbonaceous rocks under the thin dust layer. You find chunks of metallic rock occasionally.
        LoushineSrfLandedNeck = You wonder if the low gravity could allow for less bouncy objects to be treated like rubber balls. You pick a chunk of dark rock from the sample and throw it into the ground, only for it to shatter into dusty pebbles.
        LoushineSrfLandedCraters = No traces of the impacting objects can be found in the sample. Strange indeed.

        EverhartSrfLandedHighlands = Very dusty and loose material, as though it were held together by static electricity that you neutralized by touching it. You feel lucky the gravity is so weak, lest you run the risk of falling right through it.
        EverhartSrfLandedLowlands = Clumpy rocks that are still loose and easy to break off. It seems any statue chiseled from the rocks here would simply crumble if subject to Kerbin's gravity... perhaps this is a space rock's version of muscular atrophy?
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    @RESULTS
    {
        DresInSpaceHigh = Exposed to the planet's exosphere, some of the samples have crystaline structures forming on their surfaces. The moment you close the container, they melt; turning into condensation that pools at the bottom of the tray.
        DresInSpaceLow = Particulates of salt and silicate cling to the samples. You deduce that the material's been ejected by either cryovolcanic activity, or a just-recent meteoroid striking the surface of Dres.
        DresSrfLanded = Drifting dust sticks to the exposed samples. It's probably best to leave it alone and do something else for a while.

        PlasInSpaceHigh = Some of the samples seem to rattle loose from their containers, floating around freely in zero-gravity.
        PlasInSpaceLow = Exposing the samples to the vacuum of space cause many of them to mysteriously lose their luster. Upon closer inspection, a thin layer of silca dust latched onto each of the samples brought back aboard. 
        PlasSrfLanded = None of the samples react with any material gathered from the surface. Maybe it simply wasn't meant to be, but its best to report our findings anyway.

        KrovInSpaceHigh = Several of the samples break apart immediately after opening the doors of the container. Crystal shards and micrometeroids can be seen bouncing around the inside of its housing.
        KrovInSpaceLow = Many of the materials inside the sample container shift towards one side. Looking outside, it's clear they're being influenced by Plas; sitting in the same spot it always does... all of the time.
        KrovSrfLanded = The fine particulates that cling to the samples create a field of static electricity around them. Trying to handle these samples without proper protection gives you a healthy zapping.

        SelbigInSpaceHigh = Nothing is found to be out of the ordinary with the samples up here.
        SelbigInSpaceLow = The samples inside the materials bay start to go pale from the solar radiation outside.
        SelbigSrfLanded = The sample analysis software's on the fritz; probably from the fine blue dust outside. Best to leave it alone while it's recalibrating.

        HafniaInSpaceHigh = None of the samples possess any noticeable change or reaction here.
        HafniaInSpaceLow = None of the samples possess any noticeable change or reaction here.
        HafniaSrfLanded = None of the samples possess any noticeable change or reaction here.

        KortensInSpaceHigh = The samples emit a soft hum, growing and shrinking in volume based on the proximity of the asteroid's moons to it.
        KortensInSpaceLow = Some of the samples shift in color to reflect the surface below. How fascinating!
        KortensSrfLanded = The sample computer doesn't seem to be responding to any input. The display, however, outputs a neverending chain of molecules that mirror organic compounds found on Kerbin. Looking back, the samples have merged together into a singular unit, skittering around the container like a hamster on a wheel. Mission Control wouldn't believe you if you told them what just happened.

        LuiInSpaceHigh = Dust from the surface of Lui is found drifting into the onboard sample containers. Control groups don't really have much of a meaning anymore.
        LuiInSpaceLow = Dust from the surface of Lui is found drifting into the onboard sample containers. Control groups don't really have much of a meaning anymore.
        LuiSrfLanded = The sample computer seems to be stuck, continuously buffering. Mission Control's suggestions of "turning it off and on again" don't seem to help one bit.

        AntonInSpace = The samples seem to be sensitive to the minute changes in gravity near Anton. Some of them break free of their test stands, floating freely inside the container. It's probably due to the spacecraft's change in momentum during capture.
        AntonSrfLanded = Some of the samples clump together into a diamond, rolling around the container. Definitely nothing to worry about!

        LoushineInSpaceHigh = Nothing out of the ordinary, the samples act as though Loushine wasn't even there.
        LoushineInSpaceLow = Nothing of note is detected within the materials bay.
        LoushineSrfLanded = Three samples start to glow from the stellar radiation.

        EverhartInSpaceHigh = Nothing of note is found in the materials bay.
        EverhartInSpaceLow = A sample starts to glow due to cosmic radiation.
        EverhartSrfLanded = Some of the samples gain a slight blue tint to them. The red computer interface comments that it dooes not appreciate the clash in colors, despite the difference being barely noticeable.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    @RESULTS
    {
        LoushineSrfLanded = The cold surface seems to be of a low enough temperature for water to freeze occasionally, but other ices may not survive as easily.

        EverhartSrfLanded = The surface temperature is a bit higher than expected, but still cold.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    @RESULTS
    {
        DresInSpaceLow = Vapor from recent cryovolcanic activity registers on the instrumentation, but its not nearly enough to count as part of an atmosphere.
        DresSrfLanded = Just to double check, you analyze the pressure readings again. Nothing is displayed. 

        Plas = You read the sticky note you wrote to yourself: "ASTEROIDS DO NOT HAVE ATMOSPHERES" and jot down the prophetic findings, not bothering to run the experiment.

        Krov = The instrument reads zero; no atmosphere is to be found around these parts.

        Selbig = We must have left our atmosphere at home, because it's reading zero out here.

        Hafnia = For a moment, the readings jump around. Turns out the barometer was just calibrating, shortly posting its results after: Zero, no atmosphere detected. Figure it was worth a try.

        Kortens = The barometer isn't able to pick up anything with its readings. This asteroid, as expected, doesn't have an atmosphere.

        Lui = Without hesitation, the barometer spits out the following message: "No. Atmosphere. Detected."

        Anton = You patiently await the day the barometer tells you an asteroid has an atmosphere. Today… is not that day.

        Loushine =  No atmosphere. It would be an odd sight for an object this small to have one in the first place.

        Everhart = As expected, no atmosphere to speak of is present.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]
{
    @RESULTS
    {
        DresSrfLanded = Periodic bombardments from space, and the percolation of brine from underground register as slight vibrations and surface quakes.

        PlasSrfLanded = The only seismic activity that can be monitored is the shy pitter-patter of small meteroids striking the surface of Plas.

        KrovSrfLanded = The seismic activity you can pick up is sparse; the impact of meteroids is registered faintly on the instruments.

        SelbigSrfLanded = The seismic activity the instrument picks up is sparse. The echoes of meteoroid strikes heard seem to be muffled by the asteroid's compacted center.

        HafniaSrfLanded = Whatever tremendous reading would have come with the massive strike that formed this asteroid's distinct crater has long past, as nothing but a flat line is given in response to turning on the sensor.

        KortensSrfLanded = No major seismic activity is identified on Kortens. The vibrations that you can pick up suggest that Kortens is, unusually, less dense than previously expected.

        LuiSrfLanded = Seismic activity isn't able to be recorded here, but you still note the results anyway.

        AntonSrfLanded = Any seismic activity here is faint. Occasionally, a micrometeoroid will spike the readout.

        LoushineSrfLanded = Loushine is seismically dead, but Everhart's gravity seems to shift the interior occasionally.

        EverhartSrfLanded = The vessel making contact with Everhart might be the first seismic activity Everhart has experienced in millennia.
    }
}

