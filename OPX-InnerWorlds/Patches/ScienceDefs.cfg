        PlasSrfLandedMidlands = The instruments aboard record the subtle changes in the field with the asteroid's moon floating close nearby.
        PlasSrfLandedHighlands = The instruments aboard record the subtle changes in the field with the asteroid's moon floating close nearby.
        PlasSrfLandedPoles = Gravitational readouts appear to be significantly stronger here compared to other parts of the asteroid. Testing this yourself, the centrifugal force of Plas' rotation keeps you grounded more here than the equator does.
        PlasSrfLandedCraters = The denser concentration of conglomerate material here causes the sensors onboard to generate a higher field readout than what would otherwise be found on this asteroid.
        PlasSrfLandedHoganCrater = The denser concentration of conglomerate material here causes the sensors onboard to generate a higher field readout than what would otherwise be found on this asteroid.
        PlasSrfLandedMountBasore = The sensors return a much higher than expected gravitational reading in this area. Perhaps something is buried here.

        KrovInSpace = The sensor takes note of the interaction between Krov and Plas; the parent's much larger, albeit distant gravitational field pulling the moon into a tidally locked state. 
        KrovSrfLanded = Instruments aboard monitor the much stronger pull Plas has compared to its moon's much weaker gravitational field. It clearly explains why Krov experiences near-zero gravity conditions at all times.

        SelbigInSpace = The sensor measures a stronger gravitational pull than most asteroids in the Kerbolar system.
        SelbigSrfLandedHighlands = The local gravity is recorded to be studied later. To think a fruit could be large enough to host its own gravitational pull would stun most foodies back home.
        SelbigSrfLandedMidlands = The local gravity is recorded to be studied later. To think a fruit could be large enough to host its own gravitational pull would stun most foodies back home.
        SelbigSrfLandedLowlands = The local gravity is recorded to be studied later. To think a fruit could be large enough to host its own gravitational pull would stun most foodies back home.
        SelbigSrfLandedCraters = Due to denser material exposed by past impacts, the sensor's readouts seem to spike in proximity to these locations.
        SelbigSrfLandedWingeCrater = Due to denser material exposed by past impacts, the sensor's readouts seem to spike in proximity to these locations.

        HafniaInSpace = Very little is detected on the sensors at this distance. It wouldn't take much at all to escape this asteroid's influence. It's a surprise that you managed to capture around it at all! 
        HafniaSrfLandedCraters = Hafnia's swift rotation nets it a slightly lower surface gravity than it would normally have, though it still outmasses other objects of its size. Data gathered from the asteroid's centrifugal force, however, could be used to research artificial gravity during long voyages in space.
        HafniaSrfLandedHighlands = Hafnia's swift rotation nets it a slightly lower surface gravity than it would normally have, though it still outmasses other objects of its size. Data gathered from the asteroid's centrifugal force, however, could be used to research artificial gravity during long voyages in space.
        HafniaSrfLandedMidlands = Hafnia's swift rotation nets it a slightly lower surface gravity than it would normally have, though it still outmasses other objects of its size. Data gathered from the asteroid's centrifugal force, however, could be used to research artificial gravity during long voyages in space.
        HafniaSrfLandedLowlands = Hafnia's swift rotation nets it a slightly lower surface gravity than it would normally have, though it still outmasses other objects of its size. Data gathered from the asteroid's centrifugal force, however, could be used to research artificial gravity during long voyages in space.
        HafniaSrfLandedEjecta = Hafnia's swift rotation nets it a slightly lower surface gravity than it would normally have, though it still outmasses other objects of its size. Data gathered from the asteroid's centrifugal force, however, could be used to research artificial gravity during long voyages in space.
        HafniaSrfLandedTomlinsonCrater = // TBA

        KortensInSpace = The sensor records the interactions between Kortens and it's small moon system, twirling around in a cosmic dance. 
        KortensSrfLanded = The sensor is able to monitor the effects that Lui and Anton both have on their parent asteroid's local gravity.

        LuiInSpace = The sensor spits out gravity readings that are barely perceptable; probably thanks to its interactions with Kortens. At this rate, a sneeze alone might render someone enough velocity to escape Lui.
        LuiSrfLanded = The smallest tug of gravity can be detected close to Lui's surface. The moment the sensor drifts away, the readings stop entirely. 

        AntonInSpace = Sensors aboard monitor the complex relationship between Anton and the other two bodies it's influenced by. 
        AntonSrfLanded = With how faint the gravity is here, the sensors had to be recalibrated in order to register anything. The analysis says: smol

        LoushineInSpaceHigh = Loushine's weak gravity varies in strength vastly throughout its interior. Perhaps heavy metal deposits are hidden underneath the surface.
        LoushineInSpaceLowKaramanskiLobe = The weakest gravity on this asteroid is detected here, far weaker than the lowlands. Little else can be determined, even from this distance.
        LoushineInSpaceLowWeberLobe = The weakest gravity on this asteroid is detected here, far weaker than the lowlands. Little else can be determined, even from this distance.
        LoushineInSpaceLowSlopes = Denser regions may indicate the presence of heavy metals, but it is just as likely to be detecting hollow regions within Loushine.
        LoushineInSpaceLowNeck = Even near the center of loushine, the gravity is very weak. It would only take a kerbal a few hops to reach the highlands.
        LoushineInSpaceLowCraters = Very little change in the gravity under these craters. This is odd, considering this implies the remains of whatever objects impacted Loushine eons ago are no longer present... somehow.
        LoushineSrfLandedKaramanskiLobe = Everhart's gravitational presence is felt strongest here. Loushine's odd figure and Everhart's highly inclined orbit pose a perplexing question: shouldn't those gravitational discrepencies alone render Everhart's orbit unstable?
        LoushineSrfLandedWeberLobe = Everhart's gravitational presence is felt strongest here. Loushine's odd figure and Everhart's highly inclined orbit pose a perplexing question: shouldn't those gravitational discrepencies alone render Everhart's orbit unstable?
        LoushineSrfLandedCraters = Perhaps the lack of a difference in gravitational strength in these craters could indicate that the impacts were made by meteoroids of similar composition... or maybe from materials that cannot survive closer to the star this asteroid orbits.

        EverhartInSpaceHigh = Everhart's gravity is barely noticeable at this distance. It's comparable to what would be found around a comet.
        EverhartInSpaceLowHighlands = Everhart's gravity does not seem to fluctuate with location, suggesting an interior of nearly uniform composition.
        EverhartInSpaceLowLowlands = Even the craters that define the lowlands lack any defining differences in mass from the rest of Everhart, though whether this is the result of the composition being uniform or the gravioli detector failing to parse a gravity well this shallow is up for debate.
        EverhartSrfLandedHighlands = Loushine's gravity, while weak in its own right, puts some strain on Everhart's soft interior. The gravitational interactions between the two bodies make for an odd cosmic dance routine.
        EverhartSrfLandedLowlands = Everhart has an interior comparable to a lumpy potato, and its gravity is probably about as strong as one.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]
{
    @RESULTS
    {
        DresInSpaceLow = Trace magnetic fields are magnified by this sensitive instrument, and measured in real time as you orbit near this celestial body.  It's almost like hearing the heart beat of a planet, knowing if its dead inside or if something is churning.
        DresInSpaceHigh = You've measured the interaction between the solar wind and the magnetic field of this planet as it deflects charged particles.

        PlasInSpaceLow = To the instrument's surprise, a very weak magnetic field is observed around Plas. Without any geologic activity however, it's unclear how magnetism could be present; unless it was imparted by some greater cosmic force millions of years ago.
        PlasInSpaceHigh = Stellar wind and associated particles are found to glide lazily off of the asteroid's residual induced magnetic field. You monitor the interaction to be studied further later.

        Krov = The magnetometer finds no trace of a magnetic field here. With nothing else to reference, the instruments mistakenly pick up Plas's faint magnetic field in the background.

        Selbig = A faint, residual magnetic field is observed around Selbig. How a fruit possesses a magnetic remains one of the universe's greatest mysteries.

        Hafnia = A faint magnetic field is registered, blanketing the asteroid as a thin, invisible layer. You've measured the interaction between the solar wind and the little resistance the asteroid musters. 

        Kortens = No active magnetic field is detected around Kortens, nor its satellite system.

        Lui = The magnetometer doesn't pick up anything of value around Lui. You're unsure what you were expecting.

        Anton = Expectedly, no magnetic field was detected around Anton. Trying to expect the unexpected doesn't seem to be doing you any favors. Surely, it'll pay off eventually!

        LoushineInSpaceHigh = No magnetic field detected. Nothing out of the ordinary for an asteroid.
        LoushineInSpaceLow = No magnetic field detected, even up close.

        EverhartInSpaceHigh = Anyone could guess that a moon smaller than a city would have no magnetic field. Bringing the magnetometer here seems pointless in hindsight.
        EverhartInSpaceLow = The thought of the pointlessness of bringing this magnetometer out here to answer a question everyone already knew from the outset comes to the forefront of your mind. It was little more than dead weight... well, as heavy as things can get around an object with such weak gravity.
    }
}
